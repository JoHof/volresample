[project]
name = "volresample"
dynamic = ["version"]
description = "Fast 3D volume resampling with optimized Cython"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.0",
]

authors = [
    {name = "Johannes", email = "j.hofmanninger@gmail.com"}
]
license = "MIT"
keywords = ["volume", "resampling", "interpolation", "3d", "medical imaging", "cython"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
# Select exactly one PyTorch build when syncing (for example, `uv sync --extra cuda`).
cpu = ["torch>=2.8.0"]
cuda = [
    "torch>=2.8.0; python_version >= '3.10' and (sys_platform == 'linux' or sys_platform == 'win32')",
]
rocm = [
    "torch>=2.14.0; sys_platform == 'linux' and python_version >= '3.10'",
    "torchvision; sys_platform == 'linux' and python_version >= '3.10'",
    "rocm>=7.14,<7.15; sys_platform == 'linux' and python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/JoHof/volresample"
Source = "https://github.com/JoHof/volresample"
Documentation = "https://github.com/JoHof/volresample#readme"
"Release notes" = "https://github.com/JoHof/volresample/blob/main/RELEASE_NOTES.md"
Releases = "https://github.com/JoHof/volresample/releases"

[build-system]
requires = [
    "setuptools>=68",
    "packaging>=24.2",
    "wheel",
    "Cython>=3.0.0",
    "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Build for multiple Python versions (3.9+, 3.8 is EOL)
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*"]

# Skip PyPy, musllinux (for simplicity), and 32-bit builds
# Python 3.9 doesn't support macOS ARM64 officially
skip = ["pp*", "*-musllinux*", "*-win32", "*-manylinux_i686", "cp39-macosx_arm64"]

# Build for multiple architectures
# x86_64 on Linux, macOS, Windows
# ARM64 (aarch64) on Linux
archs = ["auto"]

# Use latest package versions instead of pinned constraints
# (needed because setuptools>=77 requires packaging>=24.2, but cibuildwheel's
# Python 3.9 constraint file pins packaging==24.1)
dependency-versions = "latest"

# Environment variables for the build
environment = {  PIP_VERBOSE = "1", PIP_PROGRESS_BAR = "off", PIP_DISABLE_PIP_VERSION_CHECK = "1"}
# Build dependencies come from [build-system] requires — no before-build needed

# Test the built wheels
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests -v --ignore={project}/tests/torch_reference.py"
test-skip = ["*-manylinux_aarch64"]  # Skip tests on QEMU-emulated platforms only

# Platform-specific settings
[tool.cibuildwheel.linux]
# Use uv for much faster dependency resolution (especially Python 3.11+)
archs = ["x86_64", "aarch64"]
build-frontend = "build[uv]"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# Repair wheel to include shared libraries
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# Use native arch per runner: macos-13 → x86_64, macos-14 → arm64
# (cross-compiling fails because Apple Clang OpenMP flags differ per arch)
archs = ["auto"]

# Repair wheel for macOS
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

# Install OpenMP and set compiler flags for macOS
before-all = "brew install libomp || true"

# Set OpenMP paths for Homebrew on both Intel and ARM Macs
[tool.cibuildwheel.macos.environment]
CFLAGS = "-I/opt/homebrew/opt/libomp/include -I/usr/local/opt/libomp/include"
LDFLAGS = "-L/opt/homebrew/opt/libomp/lib -L/usr/local/opt/libomp/lib -lomp"
CYTHON_NTHREADS = "4"
MACOSX_DEPLOYMENT_TARGET = "15.0"

[tool.cibuildwheel.windows]
# Build for 64-bit Windows
archs = ["AMD64"]

# Note: OpenMP may require special handling on Windows
# You might need to skip OpenMP or use different flags

[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = { index = "pytorch-rocm", extra = "rocm" }
rocm = { index = "pytorch-rocm", extra = "rocm" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.14"
# PyTorch 2.14 splits the ROCm runtime into packages served by this index.
# Keep it available for transitive dependencies, like `--index-url` does.
explicit = false

[dependency-groups]
dev = [
    "cibuildwheel; python_version >= '3.13'",
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "ruff",
    "mypy",
    "bandit",
    "pre-commit",
    "cython",
    "ipywidgets",
    "scipy",
    "torch",
]

[tool.setuptools]
# MANIFEST.in controls the sdist; package-data controls the wheel.
# Setting this to false prevents MANIFEST.in from leaking
# .pyx/.pxd/.c into wheels.
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "volresample._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["volresample*"]

[tool.setuptools.package-data]
volresample = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Black and isort are replaced by ruff format and ruff lint (I rules)

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "*.pyx",
    "*.c",
    "*.ipynb",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "E402",  # module level import not at top of file
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "F841",  # local variable assigned but never used
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "build", ".venv"]
skips = ["B101"]  # Skip assert_used check (common in tests)
